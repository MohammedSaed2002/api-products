<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Products</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
          🛍️ ShopAPI
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Home</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section text-white text-center d-flex align-items-center">
      <div class="container">
        <h1 class="display-4 fw-bold mb-3">Discover Amazing Products</h1>
        <p class="lead mb-4">
          Browse thousands of products across all categories. Quality guaranteed.
        </p>
        <a href="#categories" class="btn btn-light btn-lg px-5">
          Shop Now
        </a>
      </div>
    </section>

    <!-- Categories Section -->
    <section id="categories" class="py-5 bg-light">
      <div class="container">
        <h2 class="text-center fw-bold mb-4">Shop by Category</h2>
        <div id="categories-container" class="row g-3">
          <!-- Categories loaded by JS -->
          <div class="text-center py-4">
            <div class="spinner-border text-dark" role="status"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Featured Products Section -->
    <section class="py-5">
      <div class="container">
        <h2 class="text-center fw-bold mb-4">Featured Products</h2>
        <div id="products-container" class="row g-4">
          <!-- Products loaded by JS -->
          <div class="text-center py-4">
            <div class="spinner-border text-dark" role="status"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4">
      <p class="mb-0">&copy; 2025 ShopAPI. Built with DummyJSON API.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
