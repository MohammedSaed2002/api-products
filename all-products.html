<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Products | ShopAPI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">🛍️ ShopAPI</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="all-products.html">All Products</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Page Header -->
    <div class="bg-dark text-white py-4">
      <div class="container d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-1">
              <li class="breadcrumb-item">
                <a href="index.html" class="text-white-50">Home</a>
              </li>
              <li class="breadcrumb-item active text-white">All Products</li>
            </ol>
          </nav>
          <h1 class="h3 fw-bold mb-0">All Products</h1>
        </div>

        <!-- Sort Select -->
        <div>
          <select id="sort-select" class="form-select form-select-sm" style="width: 220px;">
            <option value="">— Sort By —</option>
            <option value="title-asc">Name: A → Z</option>
            <option value="title-desc">Name: Z → A</option>
            <option value="price-asc">Price: Low → High</option>
            <option value="price-desc">Price: High → Low</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Products Grid -->
    <section class="py-5">
      <div class="container">

        <!-- Total count -->
        <p id="total-count" class="text-muted mb-4"></p>

        <div id="products-container" class="row g-4">
          <div class="col-12 text-center py-5">
            <div class="spinner-border text-dark" role="status"></div>
          </div>
        </div>

        <!-- Pagination -->
        <nav class="mt-5">
          <ul id="pagination" class="pagination justify-content-center flex-wrap"></ul>
        </nav>

      </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4">
      <p class="mb-0">&copy; 2025 ShopAPI. Built with DummyJSON API.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/all-products.js"></script>
  </body>
</html>
