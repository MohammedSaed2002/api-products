<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details | ShopAPI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

<!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">🛍️ ShopAPI</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="all-products.html">All Products</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Loader -->
    <div id="loader" class="text-center py-5">
      <div class="spinner-border text-dark" role="status"></div>
    </div>

    <!-- Product Details -->
    <section id="product-details" class="py-5 d-none">
      <div class="container">

        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
          <ol class="breadcrumb" id="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item active" id="breadcrumb-name">Product</li>
          </ol>
        </nav>

        <div class="row g-5">
          <!-- Images Column -->
          <div class="col-lg-6">
            <!-- Main Image -->
            <div class="main-image-wrapper mb-3">
              <img id="main-image" src="" alt="Product" class="img-fluid rounded-3 w-100 product-main-img" />
            </div>
            <!-- Thumbnails -->
            <div id="thumbnails" class="d-flex gap-2 flex-wrap"></div>
          </div>

          <!-- Info Column -->
          <div class="col-lg-6">
            <span id="product-category" class="badge bg-secondary mb-2"></span>
            <h1 id="product-name" class="fw-bold"></h1>
            <div class="d-flex align-items-center gap-3 mb-3">
              <span id="product-rating" class="text-warning fs-5"></span>
              <span id="product-stock" class="badge"></span>
            </div>
            <h2 id="product-price" class="text-success fw-bold fs-3 mb-3"></h2>
            <p id="product-description" class="text-muted mb-4"></p>

            <!-- Product Meta -->
            <div class="product-meta p-3 rounded-3 bg-light mb-4">
              <div class="row g-2 text-center">
                <div class="col-4">
                  <p class="small text-muted mb-1">Brand</p>
                  <p class="fw-bold mb-0 small" id="meta-brand">—</p>
                </div>
                <div class="col-4">
                  <p class="small text-muted mb-1">SKU</p>
                  <p class="fw-bold mb-0 small" id="meta-sku">—</p>
                </div>
                <div class="col-4">
                  <p class="small text-muted mb-1">Warranty</p>
                  <p class="fw-bold mb-0 small" id="meta-warranty">—</p>
                </div>
              </div>
            </div>

            <button class="btn btn-dark btn-lg w-100">Add to Cart</button>
          </div>
        </div>

        <!-- Reviews Section -->
        <div class="mt-5">
          <h3 class="fw-bold mb-4">Customer Reviews</h3>
          <div id="reviews-container" class="row g-3"></div>
        </div>

      </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
      <p class="mb-0">&copy; 2025 ShopAPI. Built with DummyJSON API.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/details.js"></script>
  </body>
</html>
