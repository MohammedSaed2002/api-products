<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details | ShopAPI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">🛍️ ShopAPI</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="all-products.html">All Products</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
      <div class="container">
        <a href="javascript:history.back()" class="btn-back mb-2">← Back</a>
        <nav aria-label="breadcrumb" class="mt-2">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item active" id="breadcrumb-name">Product</li>
          </ol>
        </nav>
      </div>
    </div>

    <!-- Loader -->
    <div id="loader" class="text-center py-5">
      <div class="spinner-border" role="status" style="color: var(--accent); width:3rem; height:3rem;"></div>
    </div>

    <!-- Product Details -->
    <section id="product-details" class="py-5 d-none">
      <div class="container">
        <div class="row g-5">

          <!-- Images -->
          <div class="col-lg-6">
            <div class="mb-3">
              <img id="main-image" src="" alt="Product" class="product-main-img" />
            </div>
            <div id="thumbnails" class="d-flex gap-2 flex-wrap"></div>
          </div>

          <!-- Info -->
          <div class="col-lg-6">
            <span id="product-category" class="badge mb-2" style="background:var(--accent);border-radius:50px;font-size:0.75rem;"></span>
            <h1 id="product-name" class="fw-bold mb-2" style="font-size:1.8rem;"></h1>
            <div class="d-flex align-items-center gap-3 mb-3">
              <span id="product-rating" style="color:var(--star);font-size:1.1rem;"></span>
              <span id="product-stock" class="badge"></span>
            </div>
            <h2 id="product-price" class="fw-bold mb-3" style="font-size:2rem;color:var(--accent);"></h2>
            <p id="product-description" class="text-muted mb-4" style="line-height:1.7;"></p>

            <!-- Meta -->
            <div class="product-meta-box mb-4">
              <div class="row g-2 text-center">
                <div class="col-4">
                  <p class="small text-muted mb-1">Brand</p>
                  <p class="fw-bold mb-0 small" id="meta-brand">—</p>
                </div>
                <div class="col-4">
                  <p class="small text-muted mb-1">SKU</p>
                  <p class="fw-bold mb-0 small" id="meta-sku">—</p>
                </div>
                <div class="col-4">
                  <p class="small text-muted mb-1">Warranty</p>
                  <p class="fw-bold mb-0 small" id="meta-warranty">—</p>
                </div>
              </div>
            </div>

            <button class="btn-cart">🛒 Add to Cart</button>
          </div>
        </div>

        <!-- Reviews -->
        <div class="mt-5">
          <h3 class="fw-bold mb-4">Customer Reviews</h3>
          <div id="reviews-container" class="row g-3"></div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="text-white text-center py-4 mt-5">
      <p class="mb-0" style="opacity:0.7;">&copy; 2025 ShopAPI. Built with DummyJSON API.</p>
    </footer>

    <!-- Scroll To Top -->
    <button id="scroll-top" title="Back to top">↑</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/details.js"></script>
  </body>
</html>
