<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search | ShopAPI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">🛍️ ShopAPI</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="all-products.html">All Products</a></li>
          </ul>

          <!-- Search Form -->
          <form class="d-flex ms-3" onsubmit="handleSearch(event)">
            <input
              id="search-input"
              class="form-control form-control-sm me-2"
              type="search"
              placeholder="Search products..."
              style="width:200px; border-radius:20px;"
            />
            <button class="btn btn-sm" type="submit"
              style="background:var(--accent);color:#fff;border-radius:20px;padding:4px 14px;">
              🔍
            </button>
          </form>
        </div>
      </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
      <div class="container">
        <a href="javascript:history.back()" class="btn-back mb-2">← Back</a>
        <nav aria-label="breadcrumb" class="mt-2">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item active">Search Results</li>
          </ol>
        </nav>
        <h1 class="h3 fw-bold mb-0 text-white mt-2">
          Results for: <span id="search-title" style="color:var(--accent);"></span>
        </h1>
      </div>
    </div>

    <!-- Results -->
    <section class="py-5">
      <div class="container">
        <p id="total-count" class="count-text mb-4"></p>
        <div id="products-container" class="row g-4"></div>
        <nav class="mt-5">
          <ul id="pagination" class="pagination justify-content-center flex-wrap"></ul>
        </nav>
      </div>
    </section>

    <!-- Footer -->
    <footer class="text-white text-center py-4">
      <p class="mb-0" style="opacity:0.7;">&copy; 2025 ShopAPI. Built with DummyJSON API.</p>
    </footer>

    <!-- Scroll To Top -->
    <button id="scroll-top" title="Back to top">↑</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/search.js"></script>

    <script>
      function handleSearch(e) {
        e.preventDefault();
        const query = document.getElementById("search-input").value.trim();
        if (query) {
          window.location.href = `search.html?q=${encodeURIComponent(query)}`;
        }
      }
    </script>

  </body>
</html>
